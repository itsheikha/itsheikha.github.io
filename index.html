<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدوّنة شيخة – sheikha</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Readex+Pro:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf6f1;
    --surface: #ffffff;
    --text: #463f51;
    --text-secondary: #847a8e;
    --accent: #616283;
    --accent-light: #d4d6e2;
    --accent-hover: #4b4d66;
    --border: #dacfcd;
    --card-shadow: 0 1px 3px rgba(0,0,0,.06), 0 6px 12px rgba(0,0,0,.03);
    --card-shadow-hover: 0 2px 6px rgba(0,0,0,.08), 0 10px 20px rgba(0,0,0,.06);
    --radius: 12px;
    --font-heading: 'Amiri', serif;
    --font-body: 'Readex Pro', 'Tajawal', sans-serif;
    --font-ui: 'Tajawal', 'Readex Pro', sans-serif;
    --font-en: 'Fraunces', serif;
    --max-w: 860px;
    --transition: .25s cubic-bezier(.4,0,.2,1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    font-size: 18px;
    background: var(--bg);
    color: var(--text);
    line-height: 1.85;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }

  /* ── Header ── */
  .site-header {
    padding: 4.5rem 1.5rem 2rem;
    text-align: center;
  }

  .site-name {
    font-size: 2rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: .3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .3rem;
    direction: rtl;
  }

  .name-ar {
    font-family: var(--font-heading);
  }

  .name-en {
    font-family: var(--font-en);
    font-weight: 300;
    font-style: italic;
    font-size: 1.2rem;
    color: var(--accent);
    letter-spacing: .01em;
    direction: ltr;
  }

  .site-tagline {
    font-family: var(--font-ui);
    font-size: .95rem;
    color: var(--text-secondary);
    font-weight: 400;
    margin-top: .3rem;
  }

  /* ── Subtle divider below header ── */
  .header-rule {
    border: none;
    border-top: 1px solid var(--border);
    max-width: calc(var(--max-w) + 3rem);
    margin: 0 auto;
  }

  /* ── Main content ── */
  .main-content {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  /* ── Hero ── */
  .blog-hero {
    padding: 2.5rem 0 1.5rem;
    text-align: center;
  }

  .blog-hero h1 {
    font-family: var(--font-heading);
    font-size: 2.2rem;
    font-weight: 700;
    margin-bottom: .6rem;
    color: var(--text);
  }

  .blog-hero .lead {
    font-family: var(--font-heading);
    font-size: 1.2rem;
    color: var(--accent);
    line-height: 2;
    max-width: 600px;
    margin: 0 auto;
    font-weight: 500;
  }

  /* ── Newsletter CTA ── */
  .newsletter-cta {
    text-align: center;
    padding: 2rem 0 3rem;
  }

  .newsletter-cta .cta-text {
    font-family: var(--font-heading);
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 1.2rem;
  }

  .newsletter-form {
    display: flex;
    gap: .6rem;
    max-width: 420px;
    margin: 0 auto;
    flex-direction: row-reverse;
  }

  .newsletter-form input {
    flex: 1;
    padding: .75rem 1rem;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: var(--font-ui);
    font-size: .9rem;
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color var(--transition);
    direction: rtl;
  }

  .newsletter-form input:focus {
    border-color: var(--accent);
  }

  .newsletter-form input::placeholder {
    color: #bdb5c5;
  }

  .newsletter-form button {
    padding: .75rem 1.5rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: var(--font-ui);
    font-size: .9rem;
    font-weight: 500;
    cursor: pointer;
    transition: background var(--transition);
    white-space: nowrap;
  }

  .newsletter-form button:hover {
    background: var(--accent-hover);
  }

  /* ── Footer ── */
  .site-footer {
    text-align: center;
    padding: 2rem 1.5rem;
    border-top: 1px solid var(--border);
    max-width: calc(var(--max-w) + 3rem);
    margin: 0 auto;
  }

  .footer-name {
    font-family: var(--font-heading);
    font-size: 1.1rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .3rem;
  }

  .footer-en {
    font-family: var(--font-en);
    font-weight: 300;
    font-style: italic;
    font-size: .95rem;
    color: var(--accent);
  }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    .newsletter-form { flex-direction: column-reverse; }
    .newsletter-form input,
    .newsletter-form button { width: 100%; }
    .site-name { font-size: 1.6rem; }
    .name-en { font-size: 1.1rem; }
  }
</style>
</head>
<body>

<!-- ═══ Header ═══ -->
<header class="site-header">
  <div class="site-name">
    <span class="name-ar">شيخة</span><span class="name-en">sheikha</span>
  </div>
  <div class="site-tagline">مدوّنة شيخة</div>
</header>

<hr class="header-rule">

<!-- ═══ Main ═══ -->
<main class="main-content">

  <!-- Hero -->
  <section class="blog-hero">
    <h1>المدونة</h1>
    <p class="lead">في أثرِ الفِكرةِ وامتدادِها</p>
  </section>

  <!-- Newsletter CTA -->
  <section class="newsletter-cta">
    <p class="cta-text">اشترك في نشرتي البريدية</p>
    <div class="newsletter-form">
      <input type="email" placeholder="بريدك الإلكتروني">
      <button>اشتراك</button>
    </div>
  </section>

</main>

<!-- ═══ Footer ═══ -->
<footer class="site-footer">
  <div class="footer-name">
    <span class="name-ar">شيخة</span><span class="footer-en">sheikha</span>
  </div>
</footer>

</body>
</html>
